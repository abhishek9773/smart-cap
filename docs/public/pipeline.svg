<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Smart Cap camera preprocessing flow</title>
  <desc id="desc">The OV2640 camera provides a JPEG frame to the camera pipeline. The pipeline copies it into bounded PSRAM storage and immediately returns the camera framebuffer. JPEG decoding and resizing produce a 160 by 120 RGB565 image.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#0c7567"/>
      <stop offset="1" stop-color="#28a889"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#65978c"/>
    </marker>
    <style>
      .box{fill:#f3faf7;stroke:#c8e2d9;stroke-width:2}
      .strong{fill:#e4f6ef;stroke:url(#accent);stroke-width:2}
      .head{font:600 18px system-ui,sans-serif;fill:#123a34}
      .sub{font:14px system-ui,sans-serif;fill:#49665f}
      .arrow{stroke:#65978c;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="15" y="82" width="170" height="120" rx="16" class="box"/>
  <text x="100" y="128" text-anchor="middle" class="head">OV2640</text>
  <text x="100" y="157" text-anchor="middle" class="sub">320 × 240 JPEG</text>
  <path d="M190 142h48" class="arrow"/>
  <rect x="245" y="82" width="215" height="120" rx="16" class="strong"/>
  <text x="352" y="122" text-anchor="middle" class="head">Camera pipeline</text>
  <text x="352" y="151" text-anchor="middle" class="sub">Copy JPEG to bounded PSRAM</text>
  <text x="352" y="174" text-anchor="middle" class="sub">Release camera buffer promptly</text>
  <path d="M466 142h48" class="arrow"/>
  <rect x="520" y="82" width="220" height="120" rx="16" class="box"/>
  <text x="630" y="122" text-anchor="middle" class="head">JPEG decoder</text>
  <text x="630" y="151" text-anchor="middle" class="sub">Bounded decode scale</text>
  <text x="630" y="174" text-anchor="middle" class="sub">RGB888 intermediate</text>
  <path d="M746 142h48" class="arrow"/>
  <rect x="800" y="82" width="285" height="120" rx="16" class="strong"/>
  <text x="942" y="122" text-anchor="middle" class="head">Resize + convert</text>
  <text x="942" y="151" text-anchor="middle" class="sub">Nearest-neighbor sampling</text>
  <text x="942" y="174" text-anchor="middle" class="sub">160 × 120 RGB565 output</text>
  <path d="M352 207v49h278" fill="none" stroke="#91aaa3" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="646" y="262" class="sub">Latest-frame capture · on-demand requests · no application frame queue</text>
</svg>
